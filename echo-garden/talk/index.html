<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- No zoom and no scroll: on a phone every touch belongs to the game. -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Echo Garden Talk</title>
<meta name="description" content="The Echo Garden talk as a small game. Eight rooms follow the signal from the plant to the whole live set.">
<style>
  html, body {
    margin: 0; height: 100%; background: #000; overflow: hidden;
    touch-action: none; overscroll-behavior: none;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }
  /* 1280×800 canvas, letterboxed by game.js; nearest-neighbour when scaled. */
  #screen {
    position: absolute; background: #000;
    image-rendering: pixelated; image-rendering: crisp-edges;
  }
  /* Touch controls: hidden until the device is touch (game.js adds .touch). */
  #touch { display: none; }
  body.touch #touch { display: block; }
  #touch > * { position: fixed; touch-action: none; }
  #dpad {
    left: max(16px, env(safe-area-inset-left)); bottom: max(20px, env(safe-area-inset-bottom));
    width: 156px; height: 156px; border-radius: 50%;
    background: rgba(244, 244, 244, 0.10); border: 2px solid rgba(244, 244, 244, 0.35);
  }
  #dpad i { position: absolute; width: 52px; height: 52px; background: rgba(244, 244, 244, 0.28); border-radius: 8px; }
  #dpad .u { left: 52px; top: 0; } #dpad .d { left: 52px; bottom: 0; }
  #dpad .l { left: 0; top: 52px; } #dpad .r { right: 0; top: 52px; }
  #dpad[data-dir="up"] .u, #dpad[data-dir="down"] .d, #dpad[data-dir="left"] .l, #dpad[data-dir="right"] .r { background: rgba(255, 205, 117, 0.8); }
  .btn {
    width: 72px; height: 72px; border-radius: 50%; border: 2px solid rgba(244, 244, 244, 0.5);
    background: rgba(244, 244, 244, 0.14); color: #f4f4f4; font: bold 28px/68px monospace; text-align: center;
    padding: 0; touch-action: none;
  }
  .btn.down { background: rgba(255, 205, 117, 0.8); color: #1a1c2c; }
  #btnA { right: max(20px, env(safe-area-inset-right)); bottom: calc(max(20px, env(safe-area-inset-bottom)) + 52px); }
  #btnB { right: calc(max(20px, env(safe-area-inset-right)) + 88px); bottom: max(20px, env(safe-area-inset-bottom)); }
  #lvl { right: max(16px, env(safe-area-inset-right)); bottom: calc(max(20px, env(safe-area-inset-bottom)) + 148px); display: flex; gap: 10px; }
  #lvl .btn { position: static; width: 56px; height: 48px; border-radius: 10px; font-size: 24px; line-height: 44px; }
  /* Phone on its side: the picture fills the height, so the level buttons move
     to a column in the right-hand margin instead of sitting on the picture. */
  @media (orientation: landscape) and (max-height: 520px) {
    #lvl { top: max(10px, env(safe-area-inset-top)); bottom: auto; flex-direction: column; gap: 8px; }
    #lvl .btn { width: 52px; height: 44px; line-height: 40px; }
    #dpad { width: 132px; height: 132px; left: max(6px, env(safe-area-inset-left)); }
    #dpad i { width: 44px; height: 44px; }
    #dpad .u, #dpad .d { left: 44px; } #dpad .l, #dpad .r { top: 44px; }
    #btnA { bottom: max(14px, env(safe-area-inset-bottom)); }
    #btnB { right: max(20px, env(safe-area-inset-right)); bottom: calc(max(14px, env(safe-area-inset-bottom)) + 84px); }
  }
  /* Site: keep the level buttons below the shared Echo Garden menu (nav.js). */
  @media (orientation: landscape) and (max-height: 520px) {
    #lvl { top: calc(var(--eg-nav-h, 0px) + 10px); }
  }
</style>
</head>
<body>
<canvas id="screen" width="1280" height="800"></canvas>

<div id="touch" aria-hidden="true">
  <div id="dpad"><i class="u"></i><i class="d"></i><i class="l"></i><i class="r"></i></div>
  <div id="lvl">
    <button class="btn" data-act="prev">‹</button>
    <button class="btn" data-act="menu">≡</button>
    <button class="btn" data-act="next">›</button>
  </div>
  <button class="btn" id="btnB" data-act="b">B</button>
  <button class="btn" id="btnA" data-act="a">A</button>
</div>

<!-- Plain scripts, not modules and not fetch(): both are blocked on file://. -->
<script src="../ideas/font.js"></script>
<!-- atlas.js: role → sprite assignments from cast.html (a stub until the art agent writes it). Before art.js. -->
<script src="atlas.js"></script>
<script src="art.js"></script>
<script src="levels.js"></script>
<script src="game.js"></script>
<!-- Edit mode (tells.js, the text box) is loaded by game.js only under edit_server.mjs with ?edit. -->
<script src="../nav.js"></script>
<script>
  // The menu's height, for the CSS above; then re-fit the canvas below it (game.js fit()).
  (function () {
    var nav = document.querySelector(".eg-nav");
    function sync() { document.documentElement.style.setProperty("--eg-nav-h", (nav ? nav.offsetHeight : 0) + "px"); }
    sync();
    addEventListener("resize", sync);
    dispatchEvent(new Event("resize"));
  })();
</script>
</body>
</html>
