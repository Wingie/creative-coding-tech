author: Wingston Sharon Wilson


theme: jekyll-theme-chirpy

# Exclude from processing
exclude:
  - ppts
  - r2-worker
  - handoff.md
  - scratchpad
  - README.md
  - CLAUDE.md
  - LICENSE
  - package.json
  - package-lock.json
  - rollup.config.js

# Chirpy theme settings
# NOTE: `paginate` is intentionally unset. jekyll-paginate only paginates the
# site-root index.html, which here is the landing page — so enabling it produced
# /page2..5/ as duplicate copies of the landing page (all indexed in sitemap.xml)
# while /blog/ still received no paginator. _layouts/home.html lists all posts.

# Collections — required for _tabs/ to output pages
collections:
  tabs:
    output: true
    sort_by: order
  projects:
    output: true
    sort_by: order

defaults:
  - scope:
      path: ""
      type: tabs
    values:
      layout: page
      permalink: /:title/
  - scope:
      path: ""
      type: projects
    values:
      layout: project-detail
      permalink: /projects/:name/

# Jekyll Archives
jekyll-archives:
  enabled: 
    - categories
    - tags
  layouts:
    category: category
    tag: tag
  permalinks:
    category: /categories/:name/
    tag: /tags/:name/